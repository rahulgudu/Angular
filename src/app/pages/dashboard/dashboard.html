<div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">

  <!-- SALES PERFORMANCE -->
  <p-card class="bg-gray-100! shadow-xl! border! border-gray-300!">
    <h2 class="text-lg font-semibold text-blue-700 mb-6">Sales Performance</h2>

    <div class="grid grid-cols-3 gap-6 mb-6">
      <div>
        <p class="text-2xl font-semibold text-gray-400">$2.302 <span class="text-green-500 text-sm">↗ 29%</span></p>
        <p class="text-gray-400 text-sm">Weekly Revenue</p>
      </div>

      <div>
        <p class="text-2xl font-semibold text-gray-400">$72.302 <span class="text-green-500 text-sm">↗ 48%</span></p>
        <p class="text-gray-400 text-sm">Monthly Income</p>
      </div>

      <div>
        <p class="text-2xl font-semibold text-gray-400">$780.302 <span class="text-green-500 text-sm">↗ 64%</span></p>
        <p class="text-gray-400 text-sm">Annual Income</p>
      </div>
    </div>

    <p-chart type="bar" [data]="salesChartData" [options]="salesChartOptions"></p-chart>
  </p-card>


  <!-- INVENTORY -->
  <p-card class="bg-gray-100! shadow-xl! border! border-gray-300!">

    <h2 class="text-lg font-semibold text-blue-700 mb-6">Inventory Management</h2>

    <div class="grid grid-cols-3 gap-6 mb-6">

      <div>
        <p class="text-2xl font-semibold text-gray-400">22.543 <span class="text-green-500 text-sm">↗ 24%</span></p>
        <p class="text-gray-400 text-sm">Stock Status</p>
      </div>

      <div>
        <p class="text-2xl font-semibold text-gray-400">17.472 <span class="text-green-500 text-sm">↗ 28%</span></p>
        <p class="text-gray-400 text-sm">Inventory Turnover</p>
      </div>

      <div>
        <p class="text-2xl font-semibold text-gray-400">19.582 <span class="text-green-500 text-sm">↗ 22%</span></p>
        <p class="text-gray-400 text-sm">Products Ordered</p>
      </div>

    </div>

    <div class="space-y-4">

      <div class="flex items-center gap-4">
        <span class="w-8 text-gray-400">500</span>
        <div class="flex-1 h-3 bg-gray-300 shadow-xl! rounded flex overflow-hidden">
          <div class="bg-blue-500 w-1/3"></div>
          <div class="bg-orange-500 w-1/4"></div>
          <div class="bg-yellow-500 w-1/3"></div>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="w-8 text-gray-400">400</span>
        <div class="flex-1 h-3  bg-gray-300 shadow-xl! rounded flex overflow-hidden">
          <div class="bg-blue-500 w-1/4"></div>
          <div class="bg-orange-500 w-1/3"></div>
          <div class="bg-yellow-500 w-1/5"></div>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="w-8 text-gray-400">300</span>
        <div class="flex-1 h-3 bg-gray-300 shadow-xl! rounded flex overflow-hidden">
          <div class="bg-blue-500 w-1/5"></div>
          <div class="bg-orange-500 w-1/4"></div>
          <div class="bg-yellow-500 w-1/2"></div>
        </div>
      </div>

    </div>

  </p-card>


  <!-- HEATMAP -->
  <p-card class="bg-gray-100! shadow-xl! border! border-gray-300!">

    <h2 class="text-lg font-semibold text-blue-700 mb-6">
      Promotion and Campaign Performance
    </h2>

    <div class="grid grid-cols-12 gap-2">
      <div
        *ngFor="let cell of heatmap"
        class="h-8 rounded"
        [ngClass]="cell">
      </div>
    </div>

  </p-card>


  <!-- EMAIL CHART -->
  <p-card class="bg-gray-100! shadow-xl! border! border-gray-300!">

    <h2 class="text-lg font-semibold text-blue-700 mb-6">
      Email Data Chart
    </h2>

    <p-chart
      type="line"
      [data]="emailChartData"
      [options]="emailChartOptions">
    </p-chart>

  </p-card>

</div>
